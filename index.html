<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Hub | Cloud</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --success: #10b981; --danger: #ef4444;
            --warning: #f59e0b; --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        .wrapper { width: 100%; max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        header { margin-bottom: 30px; text-align: center; }
        header h1 { font-size: 2.2rem; font-weight: 800; margin: 0; letter-spacing: -1.5px; color: var(--text); }

        /* Navegação */
        .tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; }
        .tab-btn { 
            padding: 14px 28px; border-radius: 14px; border: none; cursor: pointer; 
            font-weight: 700; background: #e2e8f0; color: #64748b; transition: all 0.3s ease;
        }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4); }

        /* Resumo */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 35px; }
        .stat-card { background: var(--card); padding: 22px; border-radius: 24px; border: 1px solid #e2e8f0; text-align: center; transition: 0.3s; }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.03); }
        .stat-label { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 1.6rem; font-weight: 800; margin-top: 8px; display: block; }

        .tab-content { display: none; }
        .tab-content.active { display: block; animation: slideUp 0.4s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* Painel Adicionar */
        .glass-panel { background: #ffffff; padding: 40px; border-radius: 28px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 0.75rem; font-weight: 700; color: #94a3b8; margin-left: 4px; }
        input, select { padding: 16px; border-radius: 14px; border: 1.5px solid #f1f5f9; background: #f8fafc; outline: none; font-family: inherit; font-size: 1rem; }
        input:focus { border-color: var(--primary); background: white; }
        
        .btn-submit { 
            background: var(--primary); color: white; border: none; padding: 20px; 
            border-radius: 16px; font-weight: 700; cursor: pointer; margin-top: 15px; width: 100%;
            transition: 0.3s; font-size: 1rem;
        }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { background: #cbd5e1; cursor: not-allowed; }

        /* Histórico */
        .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .trans-card { 
            background: white; padding: 20px; border-radius: 22px; border: 1px solid #e2e8f0;
            display: flex; justify-content: space-between; align-items: center; transition: 0.2s;
        }
        .trans-card:hover { border-color: var(--primary); }
        .btn-del { background: #fee2e2; color: #ef4444; border: none; padding: 10px 15px; border-radius: 10px; cursor: pointer; font-size: 0.75rem; font-weight: 700; }
        .btn-del:hover { background: var(--danger); color: white; }
    </style>
</head>
<body>

<div class="wrapper">
    <header><h1>💎 Finanças Hub</h1></header>

    <div class="stats-grid">
        <div class="stat-card"><span class="stat-label" style="color: var(--success)">Receitas</span><span class="stat-value" id="totalReceitas" style="color: var(--success)">R$ 0,00</span></div>
        <div class="stat-card"><span class="stat-label" style="color: var(--danger)">Fixas</span><span class="stat-value" id="totalFixas" style="color: var(--danger)">R$ 0,00</span></div>
        <div class="stat-card"><span class="stat-label" style="color: var(--warning)">Variáveis</span><span class="stat-value" id="totalVariaveis" style="color: var(--warning)">R$ 0,00</span></div>
        <div class="stat-card" style="background: var(--text); color: white;"><span class="stat-label" style="color: #94a3b8">Saldo</span><span class="stat-value" id="totalSaldo">R$ 0,00</span></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="btn-add" onclick="openTab('add')">➕ Adicionar</button>
        <button class="tab-btn" id="btn-history" onclick="openTab('history')">📜 Histórico</button>
    </div>

    <div id="add" class="tab-content active">
        <div class="glass-panel">
            <div class="form-grid">
                <div class="input-group full-width">
                    <label>DESCRIÇÃO</label>
                    <input type="text" id="desc" placeholder="Ex: Salário, Aluguel, Supermercado">
                </div>
                <div class="input-group">
                    <label>VALOR (R$)</label>
                    <input type="number" id="valor" step="0.01" placeholder="0.00">
                </div>
                <div class="input-group">
                    <label>DATA</label>
                    <input type="date" id="data">
                </div>
                <div class="input-group full-width">
                    <label>CATEGORIA</label>
                    <select id="tipo">
                        <option value="receita">🔼 Receita</option>
                        <option value="fixa">📌 Despesa Fixa</option>
                        <option value="variavel">🛒 Despesa Variável</option>
                    </select>
                </div>
            </div>
            <button class="btn-submit" id="main-btn" onclick="adicionar()">SALVAR LANÇAMENTO</button>
        </div>
    </div>

    <div id="history" class="tab-content">
        <div id="historyGrid" class="history-grid"></div>
    </div>
</div>

<script>
    // 1. CONEXÃO DIRETA COM SEU SUPABASE
    const supabaseUrl = 'https://igplbbpbnqqaxkdtctnq.supabase.co'; 
    const supabaseKey = 'sb_publishable_AWx6kahZHEL1IQg-oW2c_w_UADSC1bg'; 
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // 2. NAVEGAÇÃO DE ABAS
    function openTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.getElementById('btn-' + tabId).classList.add('active');
        if(tabId === 'history') carregarDados();
    }

    // 3. CARREGAR E ATUALIZAR
    async function carregarDados() {
        const { data, error } = await _supabase
            .from('financas')
            .select('*')
            .order('data', { ascending: false });

        if (!error) renderizar(data);
    }

    // 4. FUNÇÃO ADICIONAR (CORRIGIDA)
    async function adicionar() {
        const btn = document.getElementById('main-btn');
        const desc = document.getElementById('desc').value;
        const valorRaw = document.getElementById('valor').value;
        const tipo = document.getElementById('tipo').value;
        const data = document.getElementById('data').value;

        if (!desc || !valorRaw || !data) {
            alert("⚠️ Preencha todos os campos!");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Salvando...";

        try {
            const { error } = await _supabase.from('financas').insert([{ 
                descricao: desc, 
                valor: parseFloat(valorRaw), 
                tipo: tipo, 
                data: data 
            }]);

            if (error) throw error;

            alert("✅ Salvo com sucesso!");
            document.getElementById('desc').value = '';
            document.getElementById('valor').value = '';
            carregarDados(); // Atualiza os totais
        } catch (err) {
            alert("❌ Erro: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "SALVAR LANÇAMENTO";
        }
    }

    // 5. FUNÇÃO EXCLUIR
    async function excluir(id) {
        if(!confirm("Deseja apagar esse item?")) return;
        const { error } = await _supabase.from('financas').delete().eq('id', id);
        if(!error) carregarDados();
    }

    // 6. RENDERIZAÇÃO NA TELA
    function renderizar(dados) {
        const grid = document.getElementById('historyGrid');
        grid.innerHTML = '';
        let tRec = 0, tFix = 0, tVar = 0;

        dados.forEach(t => {
            const cor = t.tipo === 'receita' ? 'var(--success)' : (t.tipo === 'fixa' ? 'var(--danger)' : 'var(--warning)');
            const dataFmt = t.data.split('-').reverse().join('/'); // Formata data DD/MM/AAAA

            grid.innerHTML += `
                <div class="trans-card">
                    <div>
                        <strong style="display:block; font-size:1.1rem;">${t.descricao}</strong>
                        <span style="font-size:0.8rem; color:#94a3b8; font-weight:600;">${dataFmt}</span>
                    </div>
                    <div style="text-align: right">
                        <div style="color: ${cor}; font-weight: 800; font-size: 1.1rem; margin-bottom: 8px;">R$ ${t.valor.toFixed(2)}</div>
                        <button class="btn-del" onclick="excluir('${t.id}')">DELETAR</button>
                    </div>
                </div>
            `;

            if (t.tipo === 'receita') tRec += t.valor;
            else if (t.tipo === 'fixa') tFix += t.valor;
            else tVar += t.valor;
        });

        const fmt = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('totalReceitas').innerText = fmt(tRec);
        document.getElementById('totalFixas').innerText = fmt(tFix);
        document.getElementById('totalVariaveis').innerText = fmt(tVar);
        document.getElementById('totalSaldo').innerText = fmt(tRec - (tFix + tVar));
    }

    // Inicialização
    carregarDados();
</script>
</body>
</html>
