<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Hub | Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --success: #10b981; --danger: #ef4444;
            --warning: #f59e0b; --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; padding: 0;
        }

        .wrapper { width: 100%; max-width: 1000px; margin: 0 auto; padding: 40px 20px; }

        header { margin-bottom: 30px; text-align: center; }
        header h1 { font-size: 2rem; font-weight: 800; margin: 0; letter-spacing: -1px; }

        /* Navegação por Abas */
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; }
        .tab-btn { 
            padding: 12px 25px; border-radius: 12px; border: none; cursor: pointer; 
            font-weight: 700; background: #e2e8f0; color: #64748b; transition: 0.3s;
        }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3); }

        /* Cards de Resumo */
        .stats-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; margin-bottom: 30px; 
        }
        .stat-card { 
            background: var(--card); padding: 20px; border-radius: 20px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); border: 1px solid #e2e8f0; text-align: center;
        }
        .stat-label { font-size: 0.7rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .stat-value { font-size: 1.4rem; font-weight: 800; margin-top: 5px; display: block; }

        /* Conteúdo das Abas */
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Aba 1: Adicionar */
        .glass-panel { 
            background: #ffffff; padding: 35px; border-radius: 25px; 
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .full-width { grid-column: span 2; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 0.75rem; font-weight: 700; color: #94a3b8; }
        input, select { padding: 15px; border-radius: 12px; border: 1.5px solid #f1f5f9; background: #f8fafc; outline: none; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; width: 100%; }

        /* Aba 2: Histórico (Cards) */
        .history-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .trans-card { 
            background: white; padding: 20px; border-radius: 18px; border: 1px solid #e2e8f0;
            display: flex; justify-content: space-between; align-items: center;
        }
        .trans-info strong { display: block; font-size: 1rem; }
        .trans-info span { font-size: 0.75rem; color: #94a3b8; }
        .trans-actions { text-align: right; }
        .trans-val { font-weight: 800; font-size: 1.1rem; margin-bottom: 5px; }
        .btn-del { 
            background: #fee2e2; color: #ef4444; border: none; padding: 5px 10px; 
            border-radius: 8px; cursor: pointer; font-size: 0.7rem; font-weight: 700;
        }
        .btn-del:hover { background: var(--danger); color: white; }
    </style>
</head>
<body>

<div class="wrapper">
    <header><h1>💎 Finanças Hub</h1></header>

    <div class="stats-grid">
        <div class="stat-card"><span class="stat-label" style="color: var(--success)">Receitas</span><span class="stat-value" id="totalReceitas">R$ 0,00</span></div>
        <div class="stat-card"><span class="stat-label" style="color: var(--danger)">Fixas</span><span class="stat-value" id="totalFixas">R$ 0,00</span></div>
        <div class="stat-card"><span class="stat-label" style="color: var(--warning)">Variáveis</span><span class="stat-value" id="totalVariaveis">R$ 0,00</span></div>
        <div class="stat-card" style="background: var(--text); color: white;"><span class="stat-label">Saldo</span><span class="stat-value" id="totalSaldo">R$ 0,00</span></div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('add')">➕ Novo Lançamento</button>
        <button class="tab-btn" onclick="openTab('history')">📜 Ver Histórico</button>
    </div>

    <div id="add" class="tab-content active">
        <div class="glass-panel">
            <div class="form-grid">
                <div class="input-group full-width">
                    <label>O QUE FOI?</label>
                    <input type="text" id="desc" placeholder="Ex: Salário, Aluguel, Ifood...">
                </div>
                <div class="input-group">
                    <label>VALOR (R$)</label>
                    <input type="number" id="valor" placeholder="0.00">
                </div>
                <div class="input-group">
                    <label>DATA</label>
                    <input type="date" id="data">
                </div>
                <div class="input-group full-width">
                    <label>CATEGORIA</label>
                    <select id="tipo">
                        <option value="receita">🔼 Receita</option>
                        <option value="fixa">📌 Despesa Fixa</option>
                        <option value="variavel">🛒 Despesa Variável</option>
                    </select>
                </div>
            </div>
            <button class="btn-submit" onclick="adicionar()">SALVAR NO SUPABASE</button>
        </div>
    </div>

    <div id="history" class="tab-content">
        <div id="historyGrid" class="history-grid">
            </div>
    </div>
</div>

<script>
    // Configurações do seu Supabase
    const supabaseUrl = 'SUA_URL_AQUI';
    const supabaseKey = 'SUA_CHAVE_ANON_AQUI';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    // Sistema de Troca de Abas
    function openTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        if(tabId === 'history') carregarDados(); // Recarrega ao abrir histórico
    }

    async function carregarDados() {
        const { data, error } = await _supabase.from('financas').select('*').order('data', { ascending: false });
        if (!error) renderizar(data);
    }

    async function adicionar() {
        const desc = document.getElementById('desc').value;
        const valor = parseFloat(document.getElementById('valor').value);
        const tipo = document.getElementById('tipo').value;
        const data = document.getElementById('data').value;

        if (!desc || isNaN(valor) || !data) return alert("Preencha todos os campos!");

        const { error } = await _supabase.from('financas').insert([{ 
            descricao: desc, valor: valor, tipo: tipo, data: data 
        }]);

        if (!error) {
            alert("Salvo com sucesso!");
            document.getElementById('desc').value = '';
            document.getElementById('valor').value = '';
            carregarDados();
        }
    }

    async function excluir(id) {
        if(!confirm("Tem certeza que deseja apagar?")) return;
        const { error } = await _supabase.from('financas').delete().eq('id', id);
        if(!error) carregarDados();
    }

    function renderizar(dados) {
        const grid = document.getElementById('historyGrid');
        grid.innerHTML = '';
        let tRec = 0, tFix = 0, tVar = 0;

        dados.forEach(t => {
            const dataFmt = new Date(t.data).toLocaleDateString('pt-BR', {timeZone: 'UTC'});
            const color = t.tipo === 'receita' ? 'var(--success)' : (t.tipo === 'fixa' ? 'var(--danger)' : 'var(--warning)');
            
            grid.innerHTML += `
                <div class="trans-card">
                    <div class="trans-info">
                        <strong>${t.descricao}</strong>
                        <span>${dataFmt}</span>
                    </div>
                    <div class="trans-actions">
                        <div class="trans-val" style="color: ${color}">R$ ${t.valor.toFixed(2)}</div>
                        <button class="btn-del" onclick="excluir('${t.id}')">DELETAR</button>
                    </div>
                </div>
            `;

            if (t.tipo === 'receita') tRec += t.valor;
            else if (t.tipo === 'fixa') tFix += t.valor;
            else tVar += t.valor;
        });

        const fmt = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('totalReceitas').innerText = fmt(tRec);
        document.getElementById('totalFixas').innerText = fmt(tFix);
        document.getElementById('totalVariaveis').innerText = fmt(tVar);
        document.getElementById('totalSaldo').innerText = fmt(tRec - tFix - tVar);
    }

    carregarDados();
</script>
</body>
</html>
