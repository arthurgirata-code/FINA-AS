<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financeiro Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4f46e5; --success: #10b981; --danger: #ef4444;
            --warning: #f59e0b; --bg: #f1f5f9; --card: #ffffff; --text: #1e293b;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; padding: 0;
        }

        /* Layout Principal */
        .wrapper { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }

        header { margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.025em; margin: 0; }

        /* Cards de Resumo */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 24px; margin-bottom: 40px; 
        }
        .stat-card { 
            background: var(--card); padding: 24px; border-radius: 16px; 
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0;
        }
        .stat-label { font-size: 0.875rem; font-weight: 600; color: #64748b; text-transform: uppercase; }
        .stat-value { font-size: 2rem; font-weight: 700; margin-top: 8px; display: block; }

        /* Formulário Horizontal */
        .glass-panel { 
            background: #1e293b; padding: 30px; border-radius: 20px; color: white; 
            margin-bottom: 40px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }
        .form-grid { 
            display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 15px; align-items: flex-end; 
        }
        .input-group label { display: block; font-size: 0.75rem; margin-bottom: 8px; font-weight: 500; color: #94a3b8; }
        input, select { 
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155;
