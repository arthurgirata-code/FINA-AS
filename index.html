<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Financeiro Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #4f46e5; --success: #10b981; --danger: #ef4444;
            --warning: #f59e0b; --bg: #f1f5f9; --card: #ffffff; --text: #1e293b;
        }

        body { 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; padding: 0;
        }

        /* Layout Principal */
        .wrapper { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }

        header { margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.025em; margin: 0; }

        /* Cards de Resumo */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 24px; margin-bottom: 40px; 
        }
        .stat-card { 
            background: var(--card); padding: 24px; border-radius: 16px; 
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0;
        }
        .stat-label { font-size: 0.875rem; font-weight: 600; color: #64748b; text-transform: uppercase; }
        .stat-value { font-size: 2rem; font-weight: 700; margin-top: 8px; display: block; }

        /* Formulário Horizontal */
        .glass-panel { 
            background: #1e293b; padding: 30px; border-radius: 20px; color: white; 
            margin-bottom: 40px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
        }
        .form-grid { 
            display: grid; grid-template-columns: 2fr 1fr 1fr 1fr auto; gap: 15px; align-items: flex-end; 
        }
        .input-group label { display: block; font-size: 0.75rem; margin-bottom: 8px; font-weight: 500; color: #94a3b8; }
        input, select { 
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; 
            background: #334155; color: white; font-size: 1rem; outline: none;
        }
        input:focus { border-color: var(--primary); }
        .btn-add { 
            background: var(--primary); color: white; border: none; padding: 14px 28px; 
            border-radius: 10px; font-weight: 700; cursor: pointer; transition: all 0.2s;
        }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4); }

        /* Listas Lado a Lado */
        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .list-container { background: var(--card); border-radius: 20px; padding: 30px; border: 1px solid #e2e8f0; }
        .list-header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px;
        }
        .list-header h2 { margin: 0; font-size: 1.25rem; }

        .transaction-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 16px; border-radius: 12px; margin-bottom: 8px; transition: background 0.2s;
        }
        .transaction-row:hover { background: #f8fafc; }
        .t-info strong { display: block; font-size: 1rem; }
        .t-info span { font-size: 0.75rem; color: #94a3b8; }
        .t-amount { font-weight: 700; font-size: 1.1rem; }

        .tag { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; margin-left: 8px; }
        .tag-fixa { background: #fee2e2; color: #ef4444; }
        .tag-var { background: #fef3c7; color: #d97706; }

        @media (max-width: 900px) {
            .form-grid { grid-template-columns: 1fr; }
            .content-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>💎 Finanças Hub</h1>
        <div id="status-banco" style="font-size: 0.8rem; color: #64748b;">Conectado ao Supabase</div>
    </header>

    <div class="stats-grid">
        <div class="stat-card" style="border-left: 6px solid var(--success);">
            <span class="stat-label">Receitas</span>
            <span class="stat-value" id="totalReceitas" style="color: var(--success);">R$ 0,00</span>
        </div>
        <div class="stat-card" style="border-left: 6px solid var(--danger);">
            <span class="stat-label">Despesas Fixas</span>
            <span class="stat-value" id="totalFixas">R$ 0,00</span>
        </div>
        <div class="stat-card" style="border-left: 6px solid var(--warning);">
            <span class="stat-label">Variáveis</span>
            <span class="stat-value" id="totalVariaveis">R$ 0,00</span>
        </div>
        <div class="stat-card" style="background: var(--primary); color: white;">
            <span class="stat-label" style="color: #c7d2fe;">Saldo Líquido</span>
            <span class="stat-value" id="totalSaldo">R$ 0,00</span>
        </div>
    </div>

    <div class="glass-panel">
        <div class="form-grid">
            <div class="input-group">
                <label>O QUE FOI?</label>
                <input type="text" id="desc" placeholder="Ex: Aluguel, Salário, Pizza...">
            </div>
            <div class="input-group">
                <label>VALOR (R$)</label>
                <input type="number" id="valor" placeholder="0.00">
            </div>
            <div class="input-group">
                <label>CATEGORIA</label>
                <select id="tipo">
                    <option value="receita">🔼 Receita</option>
                    <option value="fixa">📌 Despesa Fixa</option>
                    <option value="variavel">🛒 Despesa Variável</option>
                </select>
            </div>
            <div class="input-group">
                <label>DATA</label>
                <input type="date" id="data">
            </div>
            <button class="btn-add" onclick="adicionar()">ADICIONAR</button>
        </div>
    </div>

    <div class="content-grid">
        <div class="list-container">
            <div class="list-header">
                <h2 style="color: var(--danger);">📌 Despesas Fixas</h2>
                <small id="countFixas">0 itens</small>
            </div>
            <div id="listaFixas"></div>
        </div>

        <div class="list-container">
            <div class="list-header">
                <h2 style="color: var(--warning);">🛒 Despesas Variáveis</h2>
                <small id="countVariaveis">0 itens</small>
            </div>
            <div id="listaVariaveis"></div>
        </div>
    </div>
</div>

<script>
    // Substitua pelos seus dados do Supabase
    const supabaseUrl = 'https://igplbbpbnqqaxkdtctnq.supabase.co';
    const supabaseKey = 'sb_publishable_AWx6kahZHEL1IQg-oW2c_w_UADSC1bg';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function carregarDados() {
        const { data, error } = await _supabase
            .from('financas')
            .select('*')
            .order('data', { ascending: false });

        if (!error) renderizar(data);
    }

    async function adicionar() {
        const desc = document.getElementById('desc').value;
        const valor = parseFloat(document.getElementById('valor').value);
        const tipo = document.getElementById('tipo').value;
        const data = document.getElementById('data').value;

        if (!desc || isNaN(valor) || !data) return alert("Preencha os campos!");

        const { error } = await _supabase
            .from('financas')
            .insert([{ descricao: desc, valor: valor, tipo: tipo, data: data }]);

        if (!error) {
            carregarDados();
            document.getElementById('desc').value = '';
            document.getElementById('valor').value = '';
        }
    }

    function renderizar(dados) {
        const lFixas = document.getElementById('listaFixas');
        const lVariaveis = document.getElementById('listaVariaveis');
        lFixas.innerHTML = ''; lVariaveis.innerHTML = '';

        let tRec = 0, tFix = 0, tVar = 0, nFix = 0, nVar = 0;

        dados.forEach(t => {
            const row = `
                <div class="transaction-row">
                    <div class="t-info">
                        <strong>${t.descricao}</strong>
                        <span>${new Date(t.data).toLocaleDateString('pt-BR')}</span>
                    </div>
                    <div class="t-amount" style="color: ${t.tipo === 'receita' ? 'var(--success)' : 'var(--text)'}">
                        ${t.tipo === 'receita' ? '+' : '-'} R$ ${t.valor.toFixed(2)}
                    </div>
                </div>
            `;

            if (t.tipo === 'receita') tRec += t.valor;
            else if (t.tipo === 'fixa') { tFix += t.valor; lFixas.innerHTML += row; nFix++; }
            else { tVar += t.valor; lVariaveis.innerHTML += row; nVar++; }
        });

        document.getElementById('totalReceitas').innerText = `R$ ${tRec.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
        document.getElementById('totalFixas').innerText = `R$ ${tFix.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
        document.getElementById('totalVariaveis').innerText = `R$ ${tVar.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
        document.getElementById('totalSaldo').innerText = `R$ ${(tRec - tFix - tVar).toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
        
        document.getElementById('countFixas').innerText = `${nFix} itens`;
        document.getElementById('countVariaveis').innerText = `${nVar} itens`;
    }

    carregarDados();
</script>
</body>
</html>
