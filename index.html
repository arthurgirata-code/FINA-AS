<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Hub | Minimal</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --success: #10b981; --danger: #ef4444;
            --warning: #f59e0b; --bg: #f8fafc; --card: #ffffff; --text: #0f172a;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }

        .wrapper { width: 100%; max-width: 1100px; padding: 40px; }

        header { margin-bottom: 30px; text-align: center; }
        header h1 { font-size: 2rem; font-weight: 800; margin: 0; letter-spacing: -1px; }

        /* Cards de Resumo Superiores */
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 20px; margin-bottom: 30px; 
        }
        .stat-card { 
            background: var(--card); padding: 25px; border-radius: 24px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .stat-label { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .stat-value { font-size: 1.7rem; font-weight: 800; margin-top: 10px; display: block; }

        /* Painel de Adicionar Organizado */
        .glass-panel { 
            background: #ffffff; padding: 40px; border-radius: 30px; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.08);
            border: 1px solid #e2e8f0;
        }
        
        .panel-title { 
            margin-bottom: 25px; font-weight: 700; color: #1e293b; 
            display: flex; align-items: center; gap: 10px; font-size: 1.1rem;
        }

        .form-grid { 
            display: grid; 
            grid-template-columns: 2fr 1fr 1fr 1fr; 
            gap: 15px; 
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 0.7rem; font-weight: 700; color: #94a3b8; margin-left: 5px; }

        input, select { 
            padding: 15px; border-radius: 15px; border: 1.5px solid #f1f5f9; 
            background: #f8fafc; font-size: 0.95rem; font-weight: 500; outline: none; transition: 0.2s;
        }
        input:focus, select:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }

        .btn-submit { 
            grid-column: span 4; margin-top: 10px;
            background: var(--primary); color: white; border: none; padding: 18px; 
            border-radius: 18px; font-weight: 700; cursor: pointer; transition: 0.3s;
            font-size: 1rem; letter-spacing: 0.5px;
        }
        .btn-submit:hover { background: #4f46e5; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2); }

    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>💎 Finanças Hub</h1>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="stat-label" style="color: var(--success)">Receitas</span>
            <span class="stat-value" id="totalReceitas" style="color: var(--success)">R$ 0,00</span>
        </div>
        <div class="stat-card">
            <span class="stat-label" style="color: var(--danger)">Despesas Fixas</span>
            <span class="stat-value" id="totalFixas" style="color: var(--danger)">R$ 0,00</span>
        </div>
        <div class="stat-card">
            <span class="stat-label" style="color: var(--warning)">Variáveis</span>
            <span class="stat-value" id="totalVariaveis" style="color: var(--warning)">R$ 0,00</span>
        </div>
        <div class="stat-card" style="background: var(--text); color: white;">
            <span class="stat-label" style="color: #94a3b8">Saldo Total</span>
            <span class="stat-value" id="totalSaldo">R$ 0,00</span>
        </div>
    </div>

    <div class="glass-panel">
        <div class="panel-title">📝 Novo Lançamento</div>
        <div class="form-grid">
            <div class="input-group">
                <label>DESCRIÇÃO DO GASTO</label>
                <input type="text" id="desc" placeholder="Ex: Assinatura Netflix, Supermercado...">
            </div>
            <div class="input-group">
                <label>VALOR</label>
                <input type="number" id="valor" placeholder="0,00">
            </div>
            <div class="input-group">
                <label>CATEGORIA</label>
                <select id="tipo">
                    <option value="receita">🔼 Receita</option>
                    <option value="fixa">📌 Despesa Fixa</option>
                    <option value="variavel">🛒 Despesa Variável</option>
                </select>
            </div>
            <div class="input-group">
                <label>DATA</label>
                <input type="date" id="data">
            </div>
            <button class="btn-submit" onclick="adicionar()">SALVAR TRANSAÇÃO NO SUPABASE</button>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://igplbbpbnqqaxkdtctnq.supabase.co';
    const supabaseKey = 'sb_publishable_AWx6kahZHEL1IQg-oW2c_w_UADSC1bg';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    async function carregarDados() {
        const { data, error } = await _supabase.from('financas').select('*');
        if (!error) atualizarResumo(data);
    }

    async function adicionar() {
        const desc = document.getElementById('desc').value;
        const valor = parseFloat(document.getElementById('valor').value);
        const tipo = document.getElementById('tipo').value;
        const data = document.getElementById('data').value;

        if (!desc || isNaN(valor) || !data) return alert("Por favor, preencha todos os campos.");

        const { error } = await _supabase.from('financas').insert([{ 
            descricao: desc, valor: valor, tipo: tipo, data: data 
        }]);

        if (!error) {
            carregarDados();
            document.getElementById('desc').value = '';
            document.getElementById('valor').value = '';
            alert("Sucesso! Lançamento salvo.");
        }
    }

    function atualizarResumo(dados) {
        let tRec = 0, tFix = 0, tVar = 0;
        dados.forEach(t => {
            if (t.tipo === 'receita') tRec += t.valor;
            else if (t.tipo === 'fixa') tFix += t.valor;
            else tVar += t.valor;
        });

        const fmt = (v) => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        document.getElementById('totalReceitas').innerText = fmt(tRec);
        document.getElementById('totalFixas').innerText = fmt(tFix);
        document.getElementById('totalVariaveis').innerText = fmt(tVar);
        document.getElementById('totalSaldo').innerText = fmt(tRec - tFix - tVar);
    }

    carregarDados();
</script>

</body>
</html>
